[tox]
envlist = test_package

[testenv:test_package]
# El paquete se construye con build.sh (copia el modelo de models/ antes de empaquetar)
skip_install = true
allowlist_externals = bash
deps =
    build
commands_pre =
    bash build.sh
commands =
    bash -c "pip install --force-reinstall 'dist/agropredict_model-1.0.0-py3-none-any.whl[test]'"
    pytest tests -v